name: agent-qa-mobile

defaults:
  tools:
    node: "24"

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

on:
  pull_request:
    branches:
      - "*"
  workflow_dispatch: {}

jobs:
  fingerprint:
    name: Calculate mobile fingerprints
    type: fingerprint
    environment: preview

  android_get_build:
    name: Find reusable Android build
    needs: [fingerprint]
    if: ${{ github.event_name != 'pull_request' }}
    type: get-build
    params:
      platform: android
      profile: qa-release
      distribution: internal
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  android_repack:
    name: Repack Android build
    needs: [android_get_build]
    if: ${{ github.event_name != 'pull_request' && needs.android_get_build.outputs.build_id }}
    type: repack
    params:
      build_id: ${{ needs.android_get_build.outputs.build_id }}
      profile: qa-release
      message: "Android agent QA repack"

  android_build:
    name: Build Android app
    needs: [android_get_build]
    if: ${{ github.event_name != 'pull_request' && !needs.android_get_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: qa-release
      message: "Android agent QA build"

  ios_get_build:
    name: Find reusable iOS simulator build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: qa-ios-simulator
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  ios_repack:
    name: Repack iOS simulator build
    needs: [ios_get_build]
    if: ${{ needs.ios_get_build.outputs.build_id }}
    type: repack
    params:
      build_id: ${{ needs.ios_get_build.outputs.build_id }}
      profile: qa-ios-simulator
      message: "iOS agent QA repack"

  ios_build:
    name: Build iOS simulator app
    needs: [ios_get_build]
    if: ${{ !needs.ios_get_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: qa-ios-simulator
      message: "iOS agent QA build"

  qa_android:
    name: Android agent-device QA
    after: [android_repack, android_build]
    if: ${{ github.event_name != 'pull_request' && (after.android_repack.status == 'success' || after.android_build.status == 'success') }}
    environment: preview
    runs_on: linux-medium-nested-virtualization
    outputs:
      status: ${{ steps.run_agent_qa.outputs.status }}
      status_label: ${{ steps.run_agent_qa.outputs.status_label }}
      top_issue: ${{ steps.run_agent_qa.outputs.top_issue }}
      screenshots_cell: ${{ steps.run_agent_qa.outputs.screenshots_cell }}
      screenshots_preview: ${{ steps.publish_screenshots.outputs.screenshots_preview || steps.run_agent_qa.outputs.screenshots_preview }}
      screenshots_artifact_branch: ${{ steps.publish_screenshots.outputs.screenshots_artifact_branch }}
      screenshots_artifact_path: ${{ steps.publish_screenshots.outputs.screenshots_artifact_path }}
      screenshots_artifact_id: ${{ steps.upload_screenshots.outputs.artifact_id }}
      recordings_cell: ${{ steps.run_agent_qa.outputs.recordings_cell }}
      section_body: ${{ steps.run_agent_qa.outputs.section_body }}
    env:
      BUILD_ID: ${{ after.android_repack.outputs.build_id || after.android_build.outputs.build_id }}
      PR_JSON: "{}"
      WORKFLOW_URL: ${{ workflow.url }}
      QA_PROVIDER: anthropic
      QA_MODEL: claude-haiku-4-5
      QA_PLATFORM: android
      APPLICATION_ID: com.abbanmustafa.worldcupnyc
      AGENT_DEVICE_ANDROID_DEVICE: ci-android
      AGENT_QA_RECORD_SCREEN: "0"
      QA_ARTIFACT_BRANCH: qa-artifacts
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: install_agent_device
        run: npm install -g agent-device@0.17.6
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ env.BUILD_ID }}
          extensions: [apk]
      - id: provision_android_emulator
        run: bash ./scripts/agent-qa/provision-android-emulator.sh
      - id: run_agent_qa
        env:
          AGENT_DEVICE_SESSION: qa-android
          AGENT_DEVICE_PLATFORM: android
          AGENT_DEVICE_SESSION_LOCK: strip
        run: bash ./scripts/agent-qa/run-and-export.sh "${{ steps.download_build.outputs.artifact_path }}"
      - id: publish_screenshots
        run: bash ./scripts/agent-qa/publish-screenshots-to-github.sh
      - uses: eas/upload_artifact
        id: upload_screenshots
        with:
          name: worldcup-agent-qa-android-screenshots
          path: artifacts/qa/screenshots/*.png
          ignore_error: true

  qa_ios:
    name: iOS agent-device QA
    after: [ios_repack, ios_build]
    if: ${{ after.ios_repack.status == 'success' || after.ios_build.status == 'success' }}
    environment: preview
    runs_on: macos-medium
    outputs:
      status: ${{ steps.run_agent_qa.outputs.status }}
      status_label: ${{ steps.run_agent_qa.outputs.status_label }}
      top_issue: ${{ steps.run_agent_qa.outputs.top_issue }}
      screenshots_cell: ${{ steps.run_agent_qa.outputs.screenshots_cell }}
      screenshots_preview: ${{ steps.publish_screenshots.outputs.screenshots_preview || steps.run_agent_qa.outputs.screenshots_preview }}
      screenshots_artifact_branch: ${{ steps.publish_screenshots.outputs.screenshots_artifact_branch }}
      screenshots_artifact_path: ${{ steps.publish_screenshots.outputs.screenshots_artifact_path }}
      screenshots_artifact_id: ${{ steps.upload_screenshots.outputs.artifact_id }}
      recordings_cell: ${{ steps.run_agent_qa.outputs.recordings_cell }}
      section_body: ${{ steps.run_agent_qa.outputs.section_body }}
    env:
      BUILD_ID: ${{ after.ios_repack.outputs.build_id || after.ios_build.outputs.build_id }}
      PR_JSON: "{}"
      WORKFLOW_URL: ${{ workflow.url }}
      QA_PROVIDER: anthropic
      QA_MODEL: claude-haiku-4-5
      QA_PLATFORM: ios
      APPLICATION_ID: com.abbanmustafa.worldcupnyc
      AGENT_DEVICE_IOS_DEVICE: iPhone 17
      AGENT_DEVICE_DAEMON_TIMEOUT_MS: "180000"
      AGENT_DEVICE_IOS_BOOT_TIMEOUT_MS: "180000"
      AGENT_QA_RECORD_SCREEN: "0"
      QA_ARTIFACT_BRANCH: qa-artifacts
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: install_agent_device
        run: npm install -g agent-device@0.17.6
      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ env.BUILD_ID }}
          extensions: [app]
      - id: provision_ios_simulator
        run: bash ./scripts/agent-qa/provision-ios-simulator.sh
      - id: run_agent_qa
        env:
          AGENT_DEVICE_SESSION: qa-ios
          AGENT_DEVICE_PLATFORM: ios
          AGENT_DEVICE_SESSION_LOCK: strip
        run: bash ./scripts/agent-qa/run-and-export.sh "${{ steps.download_build.outputs.artifact_path }}"
      - id: publish_screenshots
        run: bash ./scripts/agent-qa/publish-screenshots-to-github.sh
      - uses: eas/upload_artifact
        id: upload_screenshots
        with:
          name: worldcup-agent-qa-ios-screenshots
          path: artifacts/qa/screenshots/*.png
          ignore_error: true

  qa_comment:
    name: Comment on PR
    after: [qa_ios]
    if: ${{ always() && github.event_name == 'pull_request' }}
    type: github-comment
    params:
      payload: |
        ## Agent QA

        | Platform | Status | Issues |
        | --- | --- | --- |
        | iOS | ${{ after.qa_ios.outputs.status_label || 'blocked' }} | ${{ after.qa_ios.outputs.top_issue || 'No iOS QA report was produced.' }} |

        ### Screenshot previews

        ${{ after.qa_ios.outputs.screenshots_preview || 'No inline screenshot previews were produced.' }}

        ### Screenshot artifact

        ${{ after.qa_ios.outputs.screenshots_cell || 'N/A' }}

        Branch: `${{ after.qa_ios.outputs.screenshots_artifact_branch || 'not published' }}`
        Path: `${{ after.qa_ios.outputs.screenshots_artifact_path || 'not published' }}`
        Artifact: `worldcup-agent-qa-ios-screenshots`
        ID: `${{ after.qa_ios.outputs.screenshots_artifact_id || 'not uploaded' }}`

        <details>
        <summary>Full iOS report</summary>

        ${{ after.qa_ios.outputs.section_body || 'No iOS QA section was produced.' }}

        </details>
